name: Deploy Booking Staging Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaenatchi-booking-staging-preview
  cancel-in-progress: false

jobs:
  deploy-staging-preview:
    if: github.ref == 'refs/heads/feature/receipt-drive-telegram-staging'
    runs-on: ubuntu-latest
    environment: booking-staging-preview
    steps:
      - name: Checkout staging feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/receipt-drive-telegram-staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Pages root URL
        env:
          PREVIEW_DEPLOY: "true"
        run: npm run build

      - name: Deploy only to dedicated Cloudflare Pages staging project
        run: npx --yes wrangler pages deploy dist --project-name=kaenatchi-booking-staging-preview --branch=staging-preview --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
