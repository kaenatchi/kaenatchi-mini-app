name: Booking Core staging branch build

on:
  push:
    branches:
      - staging/booking-core-connection
  pull_request:
    branches:
      - staging/booking-core-connection

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build (no deployment)
        run: npm run build
