name: Validate receipt PR build

on:
  push:
    branches:
      - ci/validate-receipt-pr64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receipt-pr-build
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Vite build (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
