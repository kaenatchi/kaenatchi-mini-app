<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>KaenatChi • Transport Diagnostic</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:#f4f7f4;color:#243229}
    body{margin:0;padding:20px}
    main{max-width:760px;margin:0 auto}
    h1{margin:0 0 8px;font-size:24px}
    p{color:#66736b;line-height:1.7}
    button{border:0;border-radius:14px;padding:13px 16px;margin:6px 0;background:#246347;color:#fff;font-weight:700;box-shadow:0 5px 16px #0001}
    .card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 6px 22px #00000010}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .status{font-weight:800}
    .ok{color:#18794e}.bad{color:#b42318}.wait{color:#8a6500}
    pre{white-space:pre-wrap;word-break:break-word;background:#f6f7f6;border-radius:12px;padding:12px;font-size:12px;direction:ltr;text-align:left}
    code{direction:ltr;display:block;word-break:break-all}
  </style>
</head>
<body>
<main>
  <h1>تست اتصال رزرو کائنات‌چی</h1>
  <p>این صفحه فقط برای تشخیص Transport است و هیچ داده‌ای در رزرو، پرداخت یا شیت تغییر نمی‌دهد.</p>
  <div class="card">
    <div><b>Endpoint</b></div>
    <code id="endpoint"></code>
    <button id="run">اجرای همه تست‌ها</button>
  </div>
  <div id="results"></div>
</main>
<script>
(function(){
  var ENDPOINT="https://script.google.com/macros/s/AKfycbyn9j5NvtVI5QaOUmSqajD3VGnFhlhnzvpbS6Hs67P6I-gx0kr71l6ZajGFp5AO7f0zg/exec";
  var results=document.getElementById("results");
  document.getElementById("endpoint").textContent=ENDPOINT;
  function card(name){
    var el=document.createElement("div");
    el.className="card";
    el.innerHTML='<div class="row"><b>'+name+'</b><span class="status wait">در حال تست…</span></div><pre></pre>';
    results.appendChild(el);
    return {el:el,status:el.querySelector(".status"),pre:el.querySelector("pre")};
  }
  function finish(c,ok,text){
    c.status.textContent=ok?"✅ موفق":"❌ ناموفق";
    c.status.className="status "+(ok?"ok":"bad");
    c.pre.textContent=text;
  }
  function qs(extra){
    var p=new URLSearchParams({action:"transportTest",_:String(Date.now())});
    Object.keys(extra||{}).forEach(function(k){p.set(k,extra[k]);});
    return p.toString();
  }
  async function directFetch(){
    var c=card("۱) fetch مستقیم با CORS");
    var started=Date.now();
    try{
      var r=await fetch(ENDPOINT+"?"+qs(),{method:"GET",mode:"cors",cache:"no-store"});
      var t=await r.text();
      finish(c,r.ok && /transport/.test(t), "HTTP "+r.status+"\nزمان: "+(Date.now()-started)+"ms\n\n"+t.slice(0,2000));
    }catch(e){finish(c,false,"زمان: "+(Date.now()-started)+"ms\n"+(e&&e.name)+"\n"+(e&&e.message));}
  }
  function jsonp(){
    var c=card("۲) JSONP با script");
    var started=Date.now();
    return new Promise(function(resolve){
      var name="__kcDiag_"+Date.now()+"_"+Math.random().toString(36).slice(2);
      var s=document.createElement("script"), done=false;
      function end(ok,text){if(done)return;done=true;clearTimeout(timer);s.remove();try{delete window[name]}catch(e){};finish(c,ok,"زمان: "+(Date.now()-started)+"ms\n\n"+text);resolve();}
      window[name]=function(data){end(!!(data&&data.transport===true),JSON.stringify(data,null,2));};
      s.onerror=function(){end(false,"SCRIPT_ERROR: مرورگر نتوانست پاسخ script را اجرا کند.");};
      var timer=setTimeout(function(){end(false,"TIMEOUT: callback JSONP در 8 ثانیه اجرا نشد.");},8000);
      s.src=ENDPOINT+"?"+qs({callback:name});
      document.head.appendChild(s);
    });
  }
  function iframeBridge(){
    var c=card("۳) iframe bridge + postMessage فعلی");
    var started=Date.now();
    return new Promise(function(resolve){
      var f=document.createElement("iframe"),done=false;
      f.style.cssText="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0";
      function end(ok,text){if(done)return;done=true;clearTimeout(timer);window.removeEventListener("message",onMessage);f.remove();finish(c,ok,"زمان: "+(Date.now()-started)+"ms\n\n"+text);resolve();}
      function onMessage(e){if(e.data&&e.data.source==="kaenatchi-booking-bridge")end(e.data.data&&e.data.data.transport===true,JSON.stringify(e.data,null,2));}
      window.addEventListener("message",onMessage);
      f.onerror=function(){end(false,"IFRAME_ERROR");};
      var timer=setTimeout(function(){end(false,"TIMEOUT: هیچ postMessage از bridge دریافت نشد.");},9000);
      f.src=ENDPOINT+"?"+qs({bridge:"iframe"});
      document.body.appendChild(f);
    });
  }
  async function run(){
    results.innerHTML="";
    await directFetch();
    await jsonp();
    await iframeBridge();
    var c=card("۴) محیط WebView");
    var info={
      userAgent:navigator.userAgent,
      platform:navigator.platform,
      online:navigator.onLine,
      origin:location.origin,
      href:location.href,
      inTelegram:!!(window.Telegram&&window.Telegram.WebApp),
      iframeSupport:!!window.HTMLIFrameElement,
      fetchSupport:!!window.fetch
    };
    finish(c,true,JSON.stringify(info,null,2));
  }
  document.getElementById("run").onclick=run;
  run();
})();
</script>
</body>
</html>
