<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KaenatChi Booking Bridge</title>
</head>
<body>
<script>
(function () {
  var message = {
    source: "kaenatchi-booking-bridge",
    data: null
  };

  try {
    var params = new URLSearchParams(window.location.search);
    var payload = params.get("payload") || "";
    var normalized = payload.replace(/-/g, "+").replace(/_/g, "/");
    while (normalized.length % 4) normalized += "=";

    var binary = atob(normalized);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }

    var json = new TextDecoder("utf-8").decode(bytes);
    message.data = JSON.parse(json);
  } catch (error) {
    message.data = {
      ok: false,
      error: "BRIDGE_ERROR",
      message: "خطا در دریافت پاسخ سامانه رزرو."
    };
  }

  /*
   * The parent Mini App is the same GitHub Pages origin after the
   * Apps Script iframe redirects here. Store the decoded response in
   * the DOM as a same-origin fallback, and also try postMessage.
   */
  var node = document.createElement("pre");
  node.id = "kaenatchi-bridge-data";
  node.style.display = "none";
  node.textContent = JSON.stringify(message.data);
  document.body.appendChild(node);

  window.__KAENATCHI_BRIDGE_DATA__ = message.data;

  try {
    window.parent.postMessage(message, "*");
  } catch (e) {}

  try {
    window.top.postMessage(message, "*");
  } catch (e) {}
})();
</script>
</body>
</html>
