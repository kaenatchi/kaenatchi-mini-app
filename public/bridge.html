<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KaenatChi Booking Bridge</title>
</head>
<body>
<script>
(function () {
  var message = {
    source: "kaenatchi-booking-bridge",
    data: null
  };

  function decode(value) {
    if (!value) return null;

    var text = String(value).trim();

    try {
      return JSON.parse(text);
    } catch (e) {}

    try {
      var normalized = text
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      while (normalized.length % 4) {
        normalized += "=";
      }

      var binary = atob(normalized);
      var bytes = new Uint8Array(binary.length);

      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return JSON.parse(
        new TextDecoder("utf-8").decode(bytes)
      );
    } catch (e) {
      return null;
    }
  }

  try {
    var params = new URLSearchParams(window.location.search);

    var candidates = [
      params.get("payload"),
      params.get("data"),
      params.get("response"),
      params.get("result")
    ];

    for (var i = 0; i < candidates.length; i++) {
      var decoded = decode(candidates[i]);

      if (decoded !== null) {
        message.data = decoded;
        break;
      }
    }

    if (message.data === null) {
      throw new Error("BRIDGE_PAYLOAD_MISSING");
    }
  } catch (error) {
    message.data = {
      ok: false,
      error: "BRIDGE_ERROR",
      message: "خطا در دریافت پاسخ سامانه رزرو."
    };
  }

  /*
   * postMessage is the primary bridge contract.
   * The DOM/global copies are kept as a harmless compatibility
   * fallback for embedded WebViews.
   */
  try {
    window.__KAENATCHI_BRIDGE_DATA__ = message.data;
  } catch (e) {}

  try {
    var node = document.createElement("pre");
    node.id = "kaenatchi-bridge-data";
    node.style.display = "none";
    node.textContent = JSON.stringify(message.data);
    document.body.appendChild(node);
  } catch (e) {}

  try {
    window.parent.postMessage(message, "*");
  } catch (e) {}

  try {
    window.top.postMessage(message, "*");
  } catch (e) {}
})();
</script>
</body>
</html>
